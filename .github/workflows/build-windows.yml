name: Build Windows

# Produces the installer and the portable executable.
#
# Run it from the Actions tab ("Run workflow"), or push a v* tag to attach the
# build to a GitHub release.
on:
  workflow_dispatch:
    inputs:
      bundle_ffmpeg:
        description: "FFmpegを同梱する（GPLでの再配布になります）"
        type: boolean
        default: false
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Cargo workspace root is the repository root, so target/ lives there.
          workspaces: ". -> target"

      - name: Install dependencies
        run: npm ci

      # Catches a broken build before spending minutes on the Rust compile.
      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Bundle FFmpeg
        if: inputs.bundle_ffmpeg || startsWith(github.ref, 'refs/tags/v')
        run: npm run fetch-ffmpeg

      - name: Build
        run: npm run tauri build

      # The installers, plus the raw exe for anyone who wants it portable.
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-exe | Out-Null
          Copy-Item "target/release/bundle/nsis/*.exe" dist-exe -ErrorAction SilentlyContinue
          Copy-Item "target/release/bundle/msi/*.msi" dist-exe -ErrorAction SilentlyContinue
          Copy-Item "target/release/*.exe" dist-exe -ErrorAction SilentlyContinue
          Get-ChildItem dist-exe

      - uses: actions/upload-artifact@v4
        with:
          name: ai-video-editor-windows
          path: dist-exe/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-exe/*
          body: |
            Windows向けビルドです。

            - `*-setup.exe` … インストーラ（推奨）
            - `*.msi` … MSIインストーラ
            - `ai-video-editor.exe` … 実行ファイル単体

            FFmpegを同梱していないビルドの場合は、別途FFmpegをPATHに通すか、
            実行ファイルと同じ階層の `bin` フォルダに置いてください。
